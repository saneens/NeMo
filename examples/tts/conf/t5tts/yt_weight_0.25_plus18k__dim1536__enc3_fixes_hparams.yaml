cfg:
  model_type: decoder_context_tts
  use_text_conditioning_encoder: true
  transcript_decoder_layers:
  - 3
  - 4
  - 5
  - 6
  - 7
  context_decoder_layers:
  - 8
  - 9
  context_duration_min: 5.0
  context_duration_max: 5.0
  use_perceiver: false
  speaker_emb_dim: 192
  num_audio_codebooks: 8
  num_audio_tokens_per_codebook: 2048
  codec_model_downsample_factor: 1024
  load_cached_codes_if_available: true
  prior_scaling_factor: 0.5
  prior_end_step: 12000
  prior_scaledown_start_step: 8000
  alignment_loss_scale: 0.002
  embedding_dim: 1536
  codecmodel_path: /gitrepos/checkpoints/AudioCodec_21Hz_no_eliz.nemo
  max_epochs: 500
  steps_per_epoch: 10000
  sample_rate: 22050
  text_tokenizers:
    english_phoneme:
      _target_: nemo.collections.common.tokenizers.text_to_speech.tts_tokenizers.IPATokenizer
      punct: true
      apostrophe: true
      pad_with_space: false
      g2p:
        _target_: nemo.collections.tts.g2p.models.i18n_ipa.IpaG2p
        phoneme_dict: scripts/tts_dataset_files/ipa_cmudict-0.7b_nv23.01.txt
        heteronyms: scripts/tts_dataset_files/heteronyms-052722
        phoneme_probability: 0.8
        ignore_ambiguous_words: false
        use_chars: true
        use_stresses: true
    spanish_phoneme:
      _target_: nemo.collections.common.tokenizers.text_to_speech.tts_tokenizers.IPATokenizer
      locale: es-ES
      punct: true
      apostrophe: true
      pad_with_space: true
      g2p:
        _target_: nemo.collections.tts.g2p.models.i18n_ipa.IpaG2p
        locale: es-ES
        phoneme_dict: scripts/tts_dataset_files/es_ES/es_ES_nv230301.dict
        phoneme_probability: 0.8
        ignore_ambiguous_words: false
        use_chars: true
        use_stresses: true
    german_phoneme:
      _target_: nemo.collections.common.tokenizers.text_to_speech.tts_tokenizers.IPATokenizer
      locale: de-DE
      punct: true
      apostrophe: true
      pad_with_space: true
      g2p:
        _target_: nemo.collections.tts.g2p.models.i18n_ipa.IpaG2p
        locale: de-DE
        phoneme_dict: scripts/tts_dataset_files/de/de_nv230119.dict
        heteronyms: scripts/tts_dataset_files/de/de_nv230119.heteronym
        phoneme_probability: 0.8
        ignore_ambiguous_words: false
        use_chars: true
        use_stresses: true
        grapheme_case: mixed
        grapheme_prefix: '#'
    mandarin_phoneme:
      _target_: nemo.collections.common.tokenizers.text_to_speech.tts_tokenizers.ChinesePhonemesTokenizer
      punct: true
      apostrophe: true
      pad_with_space: true
      g2p:
        _target_: nemo.collections.tts.g2p.models.zh_cn_pinyin.ChineseG2p
        phoneme_dict: scripts/tts_dataset_files/zh/36finals/ipa_dict_nv23.05.txt
        word_segmenter: jieba
        phoneme_prefix: ''
        phoneme_case: lower
        tone_prefix: '#'
        ascii_letter_prefix: ''
        ascii_letter_case: upper
    multilingual_sentencepiece:
      _target_: AutoTokenizer
      pretrained_model: bert-base-multilingual-uncased
  train_ds:
    dataset:
      _target_: nemo.collections.tts.data.text_to_speech_dataset.T5TTSDataset
      dataset_meta:
        hifittstrain:
          manifest_path: /tts/t5_tts/manifests_t5_exp/hifitts__phoneme__nemo_audio_21fps_8codebooks_2kcodes_v2bWithWavLM_simplet5_withContextAudioPaths.json
          audio_dir: /data/TTS/hi_fi_tts_v0
          feature_dir: /data/TTS/hi_fi_tts_v0
          sample_weight: 1.0
          tokenizer_names:
          - english_phoneme
          - multilingual_sentencepiece
        rivatrain:
          manifest_path: /tts/t5_tts/manifests_t5_exp/rivaLindyRodney__phoneme__nemo_audio_21fps_8codebooks_2kcodes_v2bWithWavLM_simplet5_withContextAudioPaths.json
          audio_dir: /data/TTS/riva
          feature_dir: /data/TTS/riva
          sample_weight: 1.0
          tokenizer_names:
          - english_phoneme
          - multilingual_sentencepiece
        rivatraintextcontext:
          manifest_path: /tts/t5_tts/manifests_t5_exp/rivaLindyRodney__phoneme__nemo_audio_21fps_8codebooks_2kcodes_v2bWithWavLM_textContextsimplet5_withContextAudioPaths.json
          audio_dir: /data/TTS/riva
          feature_dir: /data/TTS/riva
          sample_weight: 1.0
          tokenizer_names:
          - english_phoneme
          - multilingual_sentencepiece
        libri100train:
          manifest_path: /tts/t5_tts/manifests_t5_exp/libri100__phoneme__nemo_audio_21fps_8codebooks_2kcodes_v2bWithWavLM_simplet5_withContextAudioPaths.json
          audio_dir: /data/TTS/LibriTTS
          feature_dir: /data/TTS/LibriTTS
          sample_weight: 1.0
          tokenizer_names:
          - english_phoneme
          - multilingual_sentencepiece
        libri360train:
          manifest_path: /tts/t5_tts/manifests_t5_exp/libri360__phoneme__nemo_audio_21fps_8codebooks_2kcodes_v2bWithWavLM_simplet5_withContextAudioPaths.json
          audio_dir: /data/TTS/LibriTTS
          feature_dir: /data/TTS/LibriTTS
          sample_weight: 1.0
          tokenizer_names:
          - english_phoneme
          - multilingual_sentencepiece
        mlstrain:
          manifest_path: /tts/t5_tts/manifests_t5_exp/mls17k__phoneme__nemo_audio_21fps_8codebooks_2kcodes_v2bWithWavLM_verified_simplet5_withContextAudioPaths.json
          audio_dir: /MLS
          feature_dir: /MLS
          sample_weight: 0.2
          tokenizer_names:
          - english_phoneme
          - multilingual_sentencepiece
        yt:
          manifest_path: /tts/t5_tts/manifests_t5_exp/nvyt_filtered_phoneme_21hz_tts__NEAREST_CONTEXT_mapped_v2.json
          audio_dir: /dummy
          feature_dir: /dummy
          sample_weight: 0.25
          tokenizer_names:
          - english_phoneme
          - multilingual_sentencepiece
      weighted_sampling_steps_per_epoch: 10000
      sample_rate: 22050
      min_duration: 0.5
      max_duration: 20.0
    dataloader_params:
      batch_size: 16
      num_workers: 2
      drop_last: true
  validation_ds:
    dataset:
      _target_: nemo.collections.tts.data.text_to_speech_dataset.T5TTSDataset
      dataset_meta:
        libridev:
          manifest_path: /tts/t5_tts/manifests_t5_exp/dev_clean_withContextAudioPaths_withAudioCodes_codec21Khz_no_eliz_fixed_paths.json
          audio_dir: /data/TTS/LibriTTS
          feature_dir: /data/TTS/LibriTTS
          tokenizer_names:
          - english_phoneme
          - multilingual_sentencepiece
      sample_rate: 22050
      min_duration: 0.5
      max_duration: 20.0
    dataloader_params:
      batch_size: 16
      num_workers: 1
  t5_encoder:
    is_causal: false
    pos_emb:
      name: learnable_v2
      base: 10000
    use_flash_self_attention: false
    use_flash_x_attention: false
    deterministic: false
    d_model: 1536
    n_layers: 6
    p_dropout: 0.1
    n_heads: 12
    has_xattn: false
    apply_norm_to_cond: true
    kernel_size: 3
    layer_scale_init: 0.1
    layer_scale_decay: 0.95
    max_length_causal_mask: 2048
    context_xattn: null
  context_encoder:
    is_causal: false
    pos_emb:
      name: learnable_v2
      base: 10000
    use_flash_self_attention: false
    use_flash_x_attention: false
    deterministic: false
    d_model: 768
    n_layers: 6
    p_dropout: 0.1
    n_heads: 12
    has_xattn: false
    apply_norm_to_cond: true
    kernel_size: 3
    layer_scale_init: 0.1
    layer_scale_decay: 0.95
    max_length_causal_mask: 2048
    context_xattn: null
  t5_decoder:
    is_causal: true
    pos_emb:
      name: learnable_v2
      base: 10000
    use_flash_self_attention: false
    use_flash_x_attention: false
    deterministic: false
    d_model: 1536
    n_layers: 12
    p_dropout: 0.1
    n_heads: 12
    has_xattn: true
    apply_norm_to_cond: true
    kernel_size: 1
    layer_scale_init: 0.1
    layer_scale_decay: 0.95
    max_length_causal_mask: 2048
    context_xattn:
      n_heads: 12
      d_heads: 1536
      pos_emb:
        name: ''
  optim:
    _target_: torch.optim.Adam
    lr: 0.0001
    betas:
    - 0.8
    - 0.99
    sched:
      name: ExponentialLR
      gamma: 0.998
  cfg_unconditional_prob: 0.1
  target: nemo.collections.tts.models.t5tts.T5TTS_Model
  nemo_version: 2.1.0rc0
